<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NETLIV TV Audition</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial;padding:24px}.box{max-width:850px;margin:auto}.hero,.card{border:1px solid #b89435;border-radius:20px;padding:28px;margin-bottom:18px;background:#111}.hero{background:linear-gradient(135deg,#111,#211807)}h1{font-size:42px;margin:8px 0;color:#e3c568}h2{color:#e3c568}p{color:#ccc}label{display:block;margin:14px 0 6px;font-weight:bold}input,select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #444;background:#191919;color:#fff;box-sizing:border-box}textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}button{width:100%;padding:15px;border:0;border-radius:9px;background:#d2ad4f;font-weight:bold;font-size:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="box"><div class="hero"><small>NASHIK • OPEN AUDITIONS</small><h1>NETLIV TV</h1><p>AUDITION REGISTRATION<br>Show us your talent. Your screen journey starts here.</p></div><form class="card"><h2>Personal Details</h2><div class="grid"><div><label>Full Name *</label><input required></div><div><label>Date of Birth *</label><input type="date" required></div><div><label>Gender *</label><select required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div><label>Mobile Number *</label><input type="tel" required></div><div><label>WhatsApp Number</label><input type="tel"></div><div><label>Email</label><input type="email"></div><div><label>Nashik Area / Address *</label><input required></div><div><label>Instagram / Social Handle</label><input></div><div class="full"><label>Occupation</label><input></div></div><h2>Audition Profile</h2><div class="grid"><div><label>Audition Category *</label><select required><option value="">Select</option><option>Acting</option><option>Modelling</option><option>Anchoring</option><option>Dance</option><option>Singing</option><option>Other</option></select></div><div><label>Interested Role</label><input></div><div><label>Preferred Language</label><select><option>Hindi</option><option>Marathi</option><option>English</option><option>Other</option></select></div><div><label>Previous Audition Experience</label><select><option>No</option><option>Yes</option></select></div><div class="full"><label>Film / Web Series / Music Video / Theatre Experience</label><textarea></textarea></div><div class="full"><label>Tell us about yourself *</label><textarea required></textarea></div></div><h2>Availability & Links</h2><div class="grid"><div><label>Nashik Audition Availability *</label><select required><option value="">Select</option><option>Available on audition day</option><option>Need confirmation</option></select></div><div><label>Future Projects</label><select><option>Yes</option><option>No</option><option>Maybe</option></select></div><div><label>Photo / Portfolio Link</label><input></div><div><label>Intro / Audition Video Link</label><input></div></div><h2>Declaration</h2><label><input type="checkbox" required style="width:auto"> I confirm that the information provided is correct and consent to its use for audition and casting purposes.</label><button type="submit">SUBMIT AUDITION REGISTRATION</button></form></div></body></html>
